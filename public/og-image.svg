<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;display=swap');
      .font-serif { font-family: 'Georgia', 'Times New Roman', serif; }
      .font-sans  { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Teal accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="#0D9488"/>

  <!-- Background pattern — subtle grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#94A3B8"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Left accent column -->
  <rect x="0" y="0" width="4" height="630" fill="#0D9488" opacity="0.5"/>

  <!-- Logo / Brand mark -->
  <rect x="80" y="80" width="52" height="52" rx="10" fill="#0D9488"/>
  <!-- Map pin icon simplified -->
  <circle cx="106" cy="100" r="10" fill="white" opacity="0.9"/>
  <line x1="106" y1="110" x2="106" y2="122" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Platform name -->
  <text x="152" y="98" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="2">PLATFORM MONITORING WISATA</text>
  <text x="152" y="122" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="white">Kota Batu, Jawa Timur</text>

  <!-- Main headline -->
  <text x="80" y="240" class="font-serif" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" fill="white">Kelola Destinasi</text>
  <text x="80" y="314" class="font-serif" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" fill="#0D9488">Wisata Lebih Cerdas</text>

  <!-- Description -->
  <text x="80" y="380" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94A3B8" font-weight="400">Sistem monitoring destinasi wisata terpadu — pengunjung,</text>
  <text x="80" y="412" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94A3B8" font-weight="400">pengelola, dan pemerintah dalam satu ekosistem digital.</text>

  <!-- Feature pills -->
  <rect x="80" y="460" width="180" height="38" rx="6" fill="#134E4A"/>
  <text x="170" y="484" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle">Dashboard Real-time</text>

  <rect x="276" y="460" width="168" height="38" rx="6" fill="#134E4A"/>
  <text x="360" y="484" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle">Emergency Alert</text>

  <rect x="460" y="460" width="168" height="38" rx="6" fill="#134E4A"/>
  <text x="544" y="484" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle">Sensor IoT Live</text>

  <rect x="644" y="460" width="180" height="38" rx="6" fill="#134E4A"/>
  <text x="734" y="484" class="font-sans" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle">Prediksi Ekspansi</text>

  <!-- Right side — decorative chart bars -->
  <g transform="translate(920, 200)" opacity="0.7">
    <!-- Bar chart illustration -->
    <rect x="0"   y="140" width="36" height="80"  rx="4" fill="#0D9488" opacity="0.6"/>
    <rect x="52"  y="100" width="36" height="120" rx="4" fill="#0D9488" opacity="0.7"/>
    <rect x="104" y="60"  width="36" height="160" rx="4" fill="#0D9488" opacity="0.8"/>
    <rect x="156" y="30"  width="36" height="190" rx="4" fill="#0D9488"/>
    <rect x="208" y="80"  width="36" height="140" rx="4" fill="#0D9488" opacity="0.8"/>

    <!-- Chart base line -->
    <line x1="-10" y1="224" x2="260" y2="224" stroke="#1E293B" stroke-width="2"/>

    <!-- Label -->
    <text x="122" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">Tren Kunjungan Mingguan</text>
  </g>

  <!-- Bottom divider -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#1E293B" stroke-width="1"/>

  <!-- Footer -->
  <text x="80"  y="596" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#475569">© 2026 Platform Monitoring Wisata Kota Batu</text>
  <text x="1120" y="596" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#0D9488" text-anchor="end" font-weight="600">wisatabatu.vercel.app</text>
</svg>

