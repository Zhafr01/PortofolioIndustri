<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Platform Monitoring Wisata Kota Batu</title>
    <script>
      // GitHub Pages SPA redirect — preserves path for React Router
      // Sumber: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // jumlah segmen path di base URL (1 untuk /repo-name/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
